# OpenAuto Prodigy: route BT A2DP input streams through the app's EQ tap.
# The target is the app's capture node "openauto-bt-eq-in". When the app is
# not running the target does not exist and WirePlumber falls back to the
# default sink — BT audio still plays, just un-EQ'd. Do NOT add
# node.dont-fallback here; the fallback IS the failure mode.
monitor.bluez.rules = [
  {
    matches = [
      {
        # Positive A2DP match — HFP SCO voice is ALSO a bluez_input.* node
        # (api.bluez5.profile = headset-audio-gateway) and must NOT be
        # retargeted into the tap (post-merge P1, hijack observed live at the
        # 2026-07-15 bench: a call's downlink acquired target.object and mixed
        # into the tap). api.bluez5.profile IS visible at monitor-rule eval
        # (marker-probe-proven 2026-07-15, same bench); media.class is NOT
        # (bench-proven 2026-07-15: the compound class match never fired).
        node.name = "~bluez_input.*"
        api.bluez5.profile = "a2dp-source"
      }
    ]
    actions = {
      update-props = {
        target.object = "openauto-bt-eq-in"
      }
    }
  }
]
